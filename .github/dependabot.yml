# P29-INF-13: Dependabot configuration for automated dependency updates

version: 2

updates:
  # Swift Package Manager dependencies
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Johannesburg
    labels:
      - type/chore
      - area/dependencies
    commit-message:
      prefix: chore(deps)
      include: scope
    open-pull-requests-limit: 5
    reviewers:
      - regosenne
    groups:
      sentry:
        patterns:
          - "sentry*"
      supabase:
        patterns:
          - "supabase*"

  # GitHub Actions dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Johannesburg
    labels:
      - type/chore
      - area/automation
    commit-message:
      prefix: chore(ci)
      include: scope
    open-pull-requests-limit: 5
