name: iOS Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run RNFTests
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail

          device_name="$(
            xcrun simctl list devices available \
              | sed -n 's/^[[:space:]]*\(iPhone [^(]*\) (.*/\1/p' \
              | head -n 1
          )"

          if [[ -z "$device_name" ]]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,name=$device_name" >> "$GITHUB_ENV"
          echo "Selected simulator: $device_name"

      - name: Run unit tests
        run: |
          xcodebuild \
            -project RNF.xcodeproj \
            -scheme RNF \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath /tmp/RNFDerivedData \
            -only-testing:RNFTests \
            test
