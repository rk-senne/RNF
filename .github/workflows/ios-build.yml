name: iOS Build

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RNF
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project RNF.xcodeproj \
            -scheme RNF \
            -derivedDataPath /tmp/RNFDerivedData

      - name: Build app
        run: |
          xcodebuild \
            -project RNF.xcodeproj \
            -scheme RNF \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/RNFDerivedData \
            build
