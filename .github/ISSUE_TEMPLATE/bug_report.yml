name: Bug Report
description: Report incorrect behavior or a regression.
title: "[Bug]: "
labels:
  - type/bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - auth
        - supabase
        - daily-log
        - challenge
        - workout
        - reading
        - ui
        - automation
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - LOW
        - MEDIUM
        - HIGH
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
